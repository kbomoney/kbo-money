name: Auto Update KBO Data

on:
  schedule:
    - cron: '0 0 * * 1' # 매주 월요일 자동 실행
  workflow_dispatch: # 수동 실행 버튼 생성

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/python-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Run Crawler
      run: python crawl.py

    - name: Commit & Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.io"
        git add data/players.json
        git commit -m "Auto-update KBO players and salary history" || exit 0
        git push
