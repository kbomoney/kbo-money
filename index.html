<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KBO 연봉 얼마야?</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f4f6f8; color: #333;
    }
    header { background-color: #1e293b; color: #fff; text-align: center; padding: 2rem 1rem; }
    header h1 { font-size: 1.5rem; margin-bottom: 1rem; }
    .search-box { max-width: 340px; margin: 0 auto; position: relative; }
    .search-box input {
      width: 100%; padding: 0.75rem 5.5rem 0.75rem 1rem; border-radius: 24px;
      border: 2px solid #3b82f6; font-size: 1rem; outline: none;
    }
    .search-box input::placeholder { font-size: 0.85rem; color: #94a3b8; }
    .search-box button {
      position: absolute; top: 5px; right: 5px; bottom: 5px;
      padding: 0 1.1rem; border-radius: 20px; border: none;
      background-color: #3b82f6; color: #fff; font-weight: bold; cursor: pointer;
    }
    .search-box button:hover { background-color: #2563eb; }
    .stat-line { margin-top: 0.75rem; font-size: 0.8rem; color: #94a3b8; }
    main { max-width: 400px; margin: 2rem auto; padding: 0 1rem; }
    .info-text { text-align: center; color: #64748b; font-size: 0.8rem; margin-top: 2rem; line-height: 1.6; }
    .empty-msg { text-align: center; color: #94a3b8; margin-top: 2rem; }

    /* 구단 선택 */
    .section-title {
      font-size: 0.95rem; font-weight: bold; color: #475569; margin-bottom: 0.6rem;
    }
    .title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.6rem; }
    .title-row .section-title { margin-bottom: 0; }
    .rank-btn {
      padding: 0.35rem 0.75rem; border: none; border-radius: 16px;
      background: #dc2626; color: #fff; font-size: 0.8rem; font-weight: bold; cursor: pointer;
    }
    .rank-btn:hover { background: #b91c1c; }
    .pos-tabs { flex-wrap: nowrap !important; }
    .pos-tabs .rank-btn {
      flex: 0 0 auto; margin-left: auto;
      padding: 0.35rem 0.45rem; font-size: 0.75rem; white-space: nowrap;
    }



    .rank-box { background: #fff; border-radius: 12px; padding: 1rem; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .rank-head { font-weight: bold; color: #dc2626; margin-bottom: 0.6rem; font-size: 0.95rem; }
    .rank-row { display: flex; align-items: center; gap: 0.5rem; padding: 0.35rem 0; border-top: 1px solid #f1f5f9; font-size: 0.88rem; }
    .rank-row:first-of-type { border-top: none; }
    .rank-no { width: 1.6rem; color: #94a3b8; font-size: 0.8rem; }
    .rank-name { flex: 1; }
    .rank-team { color: #94a3b8; font-size: 0.78rem; }
    .rank-amt { font-weight: bold; color: #0f766e; }

    .team-grid {

      display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 1rem;
    }
    .team-btn {
      padding: 0.55rem 0.2rem; border: 1px solid #e2e8f0; border-radius: 8px;
      background: #fff; font-size: 0.85rem; font-weight: bold; color: #475569; cursor: pointer;
    }
    .team-btn:hover { border-color: #93c5fd; }
    .team-btn.active { background: #3b82f6; border-color: #3b82f6; color: #fff; }

    /* 보직 탭 */
    .pos-tabs {
      display: flex; align-items: center;
      gap: 3px; margin-bottom: 0.75rem;
    }


    .pos-tab {
      flex: 0 0 auto; padding: 0.4rem 0.45rem; border: none; border-radius: 16px;
      background: #e2e8f0; color: #475569; font-size: 0.78rem; cursor: pointer; white-space: nowrap;
    }

    .pos-tab.active { background: #0f766e; color: #fff; font-weight: bold; }

    /* 이름 목록 */
    .name-list {
      display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 1.25rem;
    }
    .name-chip {
      padding: 0.4rem 0.65rem; border: 1px solid #e2e8f0; border-radius: 8px;
      background: #fff; font-size: 0.85rem; cursor: pointer;
    }
    .name-chip:hover { border-color: #93c5fd; }
    .name-chip.active { background: #ecfdf5; border-color: #a7f3d0; color: #047857; font-weight: bold; }
    .name-chip .no { color: #cbd5e1; font-size: 0.75rem; margin-left: 3px; }
    .list-empty { color: #94a3b8; font-size: 0.85rem; padding: 0.5rem 0; }

    .player-card {
      background: #fff; border-radius: 12px; padding: 1.5rem;
      margin-bottom: 1rem; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .player-header {
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid #e2e8f0; padding-bottom: 0.75rem; margin-bottom: 1rem;
    }
    .name-wrap { display: flex; align-items: baseline; gap: 0.5rem; }
    .player-name { font-size: 1.25rem; font-weight: bold; }
    .back-no { color: #94a3b8; font-size: 0.9rem; }
    .badges { display: flex; gap: 6px; }
    .badge { padding: 0.25rem 0.5rem; border-radius: 6px; font-size: 0.8rem; font-weight: bold; }
    .badge-team { background-color: #e0f2fe; color: #0369a1; }
    .badge-coach { background-color: #fef3c7; color: #92400e; }
    .badge-league { background-color: #f1f5f9; color: #475569; }

    .player-info p { margin-bottom: 0.4rem; font-size: 0.95rem; }
    .salary-value { font-weight: bold; color: #0f766e; }
    .salary-none { color: #94a3b8; }

    .history-section { margin-top: 1rem; padding-top: 0.75rem; border-top: 1px dashed #e2e8f0; }
    .history-title { font-weight: bold; margin-bottom: 0.6rem; font-size: 0.9rem; color: #475569; }
    .timeline { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .tl-team {
      background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px;
      padding: 0.3rem 0.6rem; font-size: 0.85rem;
    }
    .tl-team.military { background: #f5f3ff; border-color: #ddd6fe; color: #6d28d9; }
    .tl-team.current { background: #ecfdf5; border-color: #a7f3d0; color: #047857; font-weight: bold; }
    .tl-arrow { color: #cbd5e1; font-size: 0.8rem; }
    .career-raw { margin-top: 0.6rem; font-size: 0.8rem; color: #94a3b8; word-break: keep-all; }

    .salary-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 0.3rem; }
    .salary-table th, .salary-table td { padding: 0.35rem 0.5rem; border-bottom: 1px solid #f1f5f9; text-align: left; }
    .salary-table th { color: #94a3b8; font-weight: normal; font-size: 0.8rem; }
    .salary-table td.amount { text-align: right; font-weight: bold; color: #0f766e; }
    .salary-table tr:last-child td { border-bottom: none; }
  </style>
</head>
<body>

  <header>
    <h1>⚾ KBO 연봉 얼마야?</h1>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="선수·감독·코치 이름 입력">
      <button id="searchBtn">검색</button>
    </div>
    <div class="stat-line" id="statLine">데이터를 불러오는 중입니다...</div>
  </header>

  <main>
    <h2 class="section-title">구단별 보기</h2>


    <div class="team-grid" id="teamGrid"></div>

    <div class="pos-tabs" id="posTabs" style="display:none;"></div>
    <div class="name-list" id="nameList"></div>
    <div id="resultContainer"></div>
    <p class="info-text">
      명단·연봉·경력은 KBO 공식 홈페이지의 선수 등록 현황과 선수 상세 정보를 기준으로 합니다.<br>
      감독·코치의 연봉은 공개되지 않아 표시하지 않습니다.
    </p>
  </main>

  <script>
    let people = [];
    const detailMap = new Map();
    const overrideMap = new Map();
    const historyMap = new Map();
    const MILITARY = new Set(['상무', '경찰', '국군체육부대']);

    const TEAMS = ['KIA', 'LG', 'NC', 'SSG', 'KT', '두산', '롯데', '삼성', '키움', '한화'];
    const POSITIONS = ['투수', '포수', '내야수', '외야수', '감독·코치'];

    let curTeam = null;
    let curPos = '투수';
    let curPid = null;

    async function loadJson(path, optional) {
      try {
        const res = await fetch(path, { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return await res.json();
      } catch (e) {
        if (!optional) throw e;
        console.info(path + ' 없음(선택 파일). 건너뜁니다.');
        return null;
      }
    }

    async function loadAll() {
      const statLine = document.getElementById('statLine');
      try {
        const seen = new Set();
        people = [];
        for (const path of ['data/players.json', 'data/players_all.json']) {
          const base = await loadJson(path, true);
          if (!base) continue;
          const rows = Array.isArray(base) ? base : (base.people || []);
          for (const p of rows) {
            const pid = String(p.playerId || '');
            if (!pid || seen.has(pid)) continue;
            seen.add(pid);
            people.push(p);
          }
        }
        if (!people.length) throw new Error('명단 파일을 읽지 못했습니다.');

        const detail = await loadJson('data/details.json', true);
        if (detail) {
          (detail.details || []).forEach(d => detailMap.set(String(d.playerId), d));
        }

        const hist = await loadJson('data/salary_history.json', true);
        if (hist && hist.players) {
          Object.entries(hist.players).forEach(([pid, v]) => {
            if (v && v.salaries && v.salaries.length) historyMap.set(String(pid), v.salaries);
          });
        }

        const manual = await loadJson('data/salary.json', true);
        if (manual) {
          const list = Array.isArray(manual) ? manual : (manual.items || []);
          list.forEach(m => overrideMap.set(String(m.playerId), m));
        }

        const withSalary = people.filter(p => getSalary(p).amount != null).length;
        statLine.textContent =
          `총 ${people.length}명 · 연봉 확인 ${withSalary}명 · 경력 ${detailMap.size}명`;

        buildTeamGrid();
      } catch (e) {
        console.error(e);
        statLine.textContent = '';
        document.getElementById('resultContainer').innerHTML =
          '<p class="empty-msg" style="color:#ef4444;">데이터를 불러오지 못했습니다. data 폴더 경로를 확인하세요.</p>';
      }
    }

    // 보직 분류: 감독·코치 / 투수 / 포수 / 내야수 / 외야수
    function posOf(person) {
      if (person.role === 'coach') return '감독·코치';
      const d = detailMap.get(String(person.playerId)) || {};
      const raw = (person.position || d.position || person.job || '');
      if (raw.includes('투수')) return '투수';
      if (raw.includes('포수')) return '포수';
      if (raw.includes('내야')) return '내야수';
      if (raw.includes('외야')) return '외야수';
      return '기타';
    }

    function buildTeamGrid() {
      const grid = document.getElementById('teamGrid');
      grid.innerHTML = TEAMS.map(t =>
        `<button class="team-btn" data-team="${esc(t)}">${esc(t)}</button>`).join('');
      grid.querySelectorAll('.team-btn').forEach(btn => {
        btn.addEventListener('click', () => selectTeam(btn.dataset.team));
      });
    }

    function selectTeam(team) {
      curTeam = (curTeam === team) ? null : team;
      curPid = null;
      document.getElementById('resultContainer').innerHTML = '';

      document.querySelectorAll('.team-btn').forEach(b =>
        b.classList.toggle('active', b.dataset.team === curTeam));

      const tabs = document.getElementById('posTabs');
      if (!curTeam) {
        tabs.style.display = 'none';
        document.getElementById('nameList').innerHTML = '';
        return;
      }

      tabs.style.display = 'flex';
      tabs.innerHTML = POSITIONS.map(p =>
        `<button class="pos-tab" data-pos="${esc(p)}">${esc(p)}</button>`).join('');
      tabs.querySelectorAll('.pos-tab').forEach(btn => {
        btn.addEventListener('click', () => {
          curPos = btn.dataset.pos;
          curPid = null;
          document.getElementById('resultContainer').innerHTML = '';
          renderNames();
        });
      });


      renderNames();
    }

    function renderNames() {
      document.querySelectorAll('.pos-tab').forEach(b =>
        b.classList.toggle('active', b.dataset.pos === curPos));

      const box = document.getElementById('nameList');
      const list = people
        .filter(p => p.team === curTeam && posOf(p) === curPos)
        .sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ko'));

      if (!list.length) {
        box.innerHTML = '<div class="list-empty">해당하는 인원이 없습니다.</div>';
        return;
      }

      box.innerHTML = list.map(p => {
        const pid = esc(p.playerId);
        const no = p.backNo ? `<span class="no">${esc(p.backNo)}</span>` : '';
        const on = String(p.playerId) === curPid ? ' active' : '';
        return `<button class="name-chip${on}" data-pid="${pid}">${esc(p.name)}${no}</button>`;
      }).join('');

      box.querySelectorAll('.name-chip').forEach(btn => {
        btn.addEventListener('click', () => {
          curPid = btn.dataset.pid;
          renderNames();
          const one = people.find(p => String(p.playerId) === curPid);
          render(one ? [one] : []);
          document.getElementById('resultContainer')
            .scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
      });
    }

    function getSalary(person) {
      const pid = String(person.playerId || '');
      const isCoach = person.role === 'coach';

      const ov = overrideMap.get(pid);
      if (ov && ov.amount != null) {
        return { amount: ov.amount, display: ov.display || formatKRW(ov.amount), status: '수동 입력' };
      }
      const d = detailMap.get(pid);
      if (d && d.salary && d.salary.amount != null) {
        return { amount: d.salary.amount, display: d.salary.display, status: d.salary.status || '공시' };
      }
      return { amount: null, display: null, status: isCoach ? '비공개' : '미공시' };
    }

    function formatKRW(won) {
      const man = Math.round(won / 10000);
      const eok = Math.floor(man / 10000);
      const rem = man % 10000;
      if (eok && rem) return `${eok}억 ${rem.toLocaleString()}만원`;
      if (eok) return `${eok}억원`;
      return `${rem.toLocaleString()}만원`;
    }

    function normalizeMoney(text) {
      if (!text) return text;
      const s = String(text).trim();
      if (!/원\s*$/.test(s)) return s;

      const eok = (s.match(/([\d,.]+)\s*억/) || [])[1];
      const man = (s.match(/([\d,.]+)\s*만\s*원/) || [])[1];
      if (!eok && !man) return s;

      const toNum = v => v ? Number(String(v).replace(/,/g, '')) : 0;
      const totalMan = toNum(eok) * 10000 + toNum(man);
      if (!totalMan) return s;

      return formatKRW(totalMan * 10000);
    }

    // 초·중·고·대로 끝나는 토큰만 남겨 학교 정보만 표시
    function schoolsOnly(raw) {
      return String(raw || '')
        .split('-')
        .map(s => s.trim())
        .filter(s => /(초|중|고|대)$/.test(s.split('(')[0].trim()))
        .join('-');
    }

    function esc(s) {

      return String(s == null ? '' : s).replace(/[&<>"']/g,
        c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }

    function search() {
      const input = document.getElementById('searchInput');
      const kw = input.value.replace(/\s+/g, '').toLowerCase();
      if (!kw) return;

      curTeam = null; curPid = null;
      document.querySelectorAll('.team-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('posTabs').style.display = 'none';
      document.getElementById('nameList').innerHTML = '';

      const hits = people.filter(p =>
        (p.name || '').replace(/\s+/g, '').toLowerCase().includes(kw));
      render(hits);
    }

    function salaryTable(person) {
      const rows = historyMap.get(String(person.playerId));
      if (!rows || !rows.length) return '';

      const body = rows.slice().sort((a, b) => b.year - a.year).map(r => {
        const disp = r.currency === 'USD'
          ? (r.display || `${Number(r.amount).toLocaleString()} 달러`)
          : formatKRW(r.amount);
        const mark = r.source === 'manual'
          ? ' <span style="font-size:.7rem;color:#94a3b8;">직접입력</span>' : '';
        return `<tr><td>${esc(r.year)}</td><td>${esc(r.team || '-')}</td>` +
               `<td class="amount">${esc(disp)}${mark}</td></tr>`;
      }).join('');

      return `
        <div class="history-section">
          <div class="history-title">연도별 연봉</div>
          <table class="salary-table">
            <tr><th>연도</th><th>구단</th><th style="text-align:right;">연봉</th></tr>
            ${body}
          </table>
        </div>`;
    }

    function render(list) {
      const box = document.getElementById('resultContainer');
      if (!list.length) {
        box.innerHTML = '<p class="empty-msg">검색 결과가 없습니다.</p>';
        return;
      }

      box.innerHTML = list.map(p => {
        const d = detailMap.get(String(p.playerId)) || {};
        const sal = getSalary(p);
        const isCoach = p.role === 'coach';

        const rawPos = d.position || '';
        const posName = rawPos.split('(')[0].trim() || (isCoach ? p.job : (p.job || '선수'));
        const throwBat = (rawPos.match(/\(([^)]+)\)/) || [])[1] || p.throwBat || '';

        const salaryHtml = sal.amount != null
          ? `<span class="salary-value">${esc(sal.display)}</span>`
          : `<span class="salary-none">${esc(sal.status)}</span>`;

        const hist = d.history || p.history || [];
        let histHtml = '<p class="salary-none" style="font-size:0.85rem;">이력 정보 없음</p>';
        if (hist.length) {
          const items = hist.map((h, i) => {
            let cls = 'tl-team';
            if (MILITARY.has(h.team)) cls += ' military';
            if (i === hist.length - 1) cls += ' current';
            const note = h.note ? ` <span style="opacity:.6;font-size:.75rem;">${esc(h.note)}</span>` : '';
            return `<span class="${cls}">${esc(h.team)}${note}</span>`;
          }).join('<span class="tl-arrow">▶</span>');
          histHtml = `<div class="timeline">${items}</div>`;
        }

        const schools = schoolsOnly(d.careerRaw);
        const careerLine = schools
          ? `<div class="career-raw">학교 정보: ${esc(schools)}</div>` : '';


        return `
          <div class="player-card">
            <div class="player-header">
              <div class="name-wrap">
                <span class="player-name">${esc(p.name)}</span>
                ${p.backNo ? `<span class="back-no">No.${esc(p.backNo)}</span>` : ''}
              </div>
              <div class="badges">
                ${isCoach ? '<span class="badge badge-coach">감독·코치</span>' : ''}
                ${p.league ? `<span class="badge badge-league">${esc(p.league)}</span>` : ''}
                <span class="badge badge-team">${esc(p.team)}</span>
              </div>
            </div>
            <div class="player-info">
              <p><strong>보직:</strong> ${esc(posName)}${throwBat ? ` (${esc(throwBat)})` : ''}</p>
              <p><strong>생년월일:</strong> ${esc(d.birth || p.birth || '정보 없음')}</p>
              ${d.physique ? `<p><strong>신장/체중:</strong> ${esc(d.physique)}</p>` : ''}
              <p><strong>연봉:</strong> ${salaryHtml}</p>
              ${d.signingBonus ? `<p><strong>입단 계약금:</strong> ${esc(normalizeMoney(d.signingBonus))}</p>` : ''}
              ${d.draft ? `<p><strong>지명순위:</strong> ${esc(d.draft)}</p>` : ''}
            </div>
            <div class="history-section">
              <div class="history-title">구단 이력</div>
              ${histHtml}
              ${careerLine}
            </div>
            ${salaryTable(p)}
          </div>`;
      }).join('');
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadAll();
      document.getElementById('searchBtn').addEventListener('click', search);
      document.getElementById('searchInput').addEventListener('keyup', e => {
        if (e.key === 'Enter') search();
      });
    });
        function showRanking() {
      const active = document.querySelector('.team-btn.active');
      const team = active ? active.dataset.team : '';
      const list = people
        .filter(p => p.role !== 'coach')
        .filter(p => !team || p.team === team)
        .map(p => ({ p, amt: (getSalary(p) || {}).amount }))
        .filter(x => typeof x.amt === 'number')
        .sort((a, b) => b.amt - a.amt)
        .slice(0, 20);

      const box = document.getElementById('resultContainer');
      if (!list.length) {
        box.innerHTML = '<p class="empty-msg">연봉 정보가 없습니다.</p>';
        return;
      }
      box.innerHTML = '<div class="rank-box">'
        + `<div class="rank-head">${esc(team || '전체')} 연봉 상위 ${list.length}명</div>`
        + list.map((x, i) =>
            `<div class="rank-row"><span class="rank-no">${i + 1}</span>`
            + `<span class="rank-name">${esc(x.p.name)}`
            + (team ? '' : ` <span class="rank-team">${esc(x.p.team || '')}</span>`)
            + `</span><span class="rank-amt">${formatKRW(x.amt)}</span></div>`
          ).join('')
        + '</div>';
      box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function showRanking() {
      const team = curTeam || '';
      const list = people
        .filter(p => p.role !== 'coach')
        .filter(p => !team || p.team === team)
        .map(p => ({ p, amt: (getSalary(p) || {}).amount }))
        .filter(x => typeof x.amt === 'number')
        .sort((a, b) => b.amt - a.amt)
        .slice(0, 20);

      const box = document.getElementById('resultContainer');

      if (!list.length) {
        box.innerHTML = '<p class="empty-msg">연봉 정보가 없습니다.</p>';
        return;
      }
      box.innerHTML = '<div class="rank-box">'
        + `<div class="rank-head">${esc(team || '전체')} 연봉 상위 ${list.length}명</div>`
        + list.map((x, i) =>
            `<div class="rank-row"><span class="rank-no">${i + 1}</span>`
            + `<span class="rank-name">${esc(x.p.name)}`
            + (team ? '' : ` <span class="rank-team">${esc(x.p.team || '')}</span>`)
            + `</span><span class="rank-amt">${formatKRW(x.amt)}</span></div>`
          ).join('')
        + '</div>';
    }

    const posTabsEl = document.getElementById('posTabs');
    new MutationObserver(() => {
      if (!posTabsEl.children.length) return;
      if (posTabsEl.querySelector('.rank-btn')) return;
      const b = document.createElement('button');
      b.className = 'rank-btn';
      b.textContent = '연봉 랭킹';
      b.addEventListener('click', showRanking);
      posTabsEl.appendChild(b);
    }).observe(posTabsEl, { childList: true });



  </script>
</body>
</html>
