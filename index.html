<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KBO 연봉 & 경력 정보관</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f4f6f8;
      color: #333;
    }
    header {
      background-color: #1e293b;
      color: #fff;
      text-align: center;
      padding: 2rem 1rem;
    }
    header h1 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }
    .search-box {
      max-width: 500px;
      margin: 0 auto;
      display: flex;
      gap: 8px;
    }
    .search-box input {
      flex: 1;
      padding: 0.75rem 1rem;
      border-radius: 20px;
      border: 2px solid #3b82f6;
      font-size: 1rem;
      outline: none;
    }
    .search-box button {
      padding: 0.75rem 1.25rem;
      border-radius: 20px;
      border: none;
      background-color: #3b82f6;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
    .search-box button:hover {
      background-color: #2563eb;
    }
    main {
      max-width: 800px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    .info-text {
      text-align: center;
      color: #64748b;
      font-size: 0.875rem;
      margin-top: 2rem;
    }
    .empty-msg {
      text-align: center;
      color: #94a3b8;
      margin-top: 3rem;
    }
    /* 카드 스타일 */
    .player-card {
      background: #fff;
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .player-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 0.75rem;
      margin-bottom: 1rem;
    }
    .player-name {
      font-size: 1.25rem;
      font-weight: bold;
    }
    .player-team {
      background-color: #e0f2fe;
      color: #0369a1;
      padding: 0.25rem 0.5rem;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: bold;
    }
    .player-info p {
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
    }
    .history-section {
      margin-top: 1rem;
      padding-top: 0.75rem;
      border-top: 1px dashed #e2e8f0;
    }
    .history-title {
      font-weight: bold;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      color: #475569;
    }
    .history-item {
      font-size: 0.85rem;
      color: #64748b;
      margin-bottom: 0.25rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>⚾ KBO 연봉 & 경력 정보관</h1>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="선수 또는 감독 이름을 입력하세요" onkeyup="if(window.event.keyCode==13){searchPlayer()}">
      <button onclick="searchPlayer()">검색</button>
    </div>
  </header>

  <main>
    <div id="resultContainer">
      <p class="empty-msg">선수 이름을 검색해 보세요.</p>
    </div>
    <p class="info-text">본 정보는 KBO 공식 발표 및 언론 보도 자료를 기반으로 제공됩니다.</p>
  </main>

  <script>
    let playersData = [];

    // 1. JSON 데이터 로드
    async function loadPlayerData() {
      try {
        const response = await fetch('data/players.json');
        if (!response.ok) {
          throw new Error(`HTTP 에러 발생 (상태: ${response.status})`);
        }
        playersData = await response.json();
        console.log(`선수 데이터 로드 완료: 총 ${playersData.length}명`);
      } catch (error) {
        console.error('JSON 데이터를 불러오지 못했습니다:', error);
        document.getElementById('resultContainer').innerHTML = 
          '<p class="empty-msg" style="color: #ef4444;">데이터를 불러오는 중 오류가 발생했습니다. (data/players.json 경로 확인 필요)</p>';
      }
    }

    // 페이지 로드시 데이터 호출
    document.addEventListener('DOMContentLoaded', loadPlayerData);

    // 2. 검색 실행 함수
    function searchPlayer() {
      const inputEl = document.getElementById('searchInput');
      const resultContainer = document.getElementById('resultContainer');

      if (!inputEl || !resultContainer) return;

      // 입력값 띄어쓰기 제거 및 소문자 변환
      const keyword = inputEl.value.replace(/\s+/g, '').toLowerCase();

      if (!keyword) {
        resultContainer.innerHTML = '<p class="empty-msg">검색어를 입력해 주세요.</p>';
        return;
      }

      // 데이터 검색
      const matchedPlayers = playersData.filter(player => {
        const cleanName = player.name ? player.name.replace(/\s+/g, '').toLowerCase() : '';
        return cleanName.includes(keyword);
      });

      renderResults(matchedPlayers);
    }

    // 3. UI 렌더링 함수
    function renderResults(players) {
      const resultContainer = document.getElementById('resultContainer');
      resultContainer.innerHTML = '';

      if (players.length === 0) {
        resultContainer.innerHTML = '<p class="empty-msg">검색 결과가 없습니다.</p>';
        return;
      }

      players.forEach(player => {
        // 연봉 정보 추출 예외 처리
        const currentSalary = player.salary || 
          (player.history && player.history.length > 0 ? player.history[0].salary : '정보 없음');

        // 히스토리 항목 렌더링
        let historyHtml = '';
        if (player.history && player.history.length > 0) {
          historyHtml = `
            <div class="history-section">
              <div class="history-title">주요 경력 및 연봉 이력</div>
              ${player.history.map(h => `
                <div class="history-item">
                  • <strong>${h.period || ''}</strong> ${h.team || ''} | ${h.salary || ''} (${h.note || ''})
                </div>
              `).join('')}
            </div>
          `;
        }

        const card = document.createElement('div');
        card.className = 'player-card';
        card.innerHTML = `
          <div class="player-header">
            <span class="player-name">${player.name}</span>
            <span class="player-team">${player.team}</span>
          </div>
          <div class="player-info">
            <p><strong>포지션:</strong> ${player.positionGroup || (player.isCoach ? '감독/코치' : '선수')}</p>
            <p><strong>현재 연봉:</strong> ${currentSalary}</p>
            <p><strong>지명/등록 정보:</strong> ${player.draftInfo || '정보 없음'}</p>
          </div>
          ${historyHtml}
        `;
        resultContainer.appendChild(card);
      });
    }
  </script>
</body>
</html>
