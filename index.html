<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KBO 연봉 & 경력 정보관</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>⚾ KBO 연봉 & 경력 정보관</h1>
    <input type="text" id="search-input" placeholder="선수 또는 코치 이름을 입력하세요...">
  </header>

  <main>
    <div class="filter-section">
      <h3>구단 선택</h3>
      
      <!-- 구단 선택 영역: 전체(1줄) + 10개 구단(5개씩 2줄) -->
      <div class="team-group">
        <button class="team-btn active" data-team="all">전체</button>
        <button class="team-btn" data-team="KIA">KIA</button>
        <button class="team-btn" data-team="삼성">삼성</button>
        <button class="team-btn" data-team="LG">LG</button>
        <button class="team-btn" data-team="두산">두산</button>
        <button class="team-btn" data-team="SSG">SSG</button>
        <button class="team-btn" data-team="KT">KT</button>
        <button class="team-btn" data-team="NC">NC</button>
        <button class="team-btn" data-team="롯데">롯데</button>
        <button class="team-btn" data-team="한화">한화</button>
        <button class="team-btn" data-team="키움">키움</button>
      </div>

      <!-- 포지션 선택 영역: 가로 한 줄 정렬 -->
      <div class="position-group">
        <button class="pos-btn active" data-pos="all">전체</button>
        <button class="pos-btn" data-pos="코치진">코치진</button>
        <button class="pos-btn" data-pos="투수">투수</button>
        <button class="pos-btn" data-pos="포수">포수</button>
        <button class="pos-btn" data-pos="내야수">내야수</button>
        <button class="pos-btn" data-pos="외야수">외야수</button>
      </div>
    </div>

    <!-- 카드 목록 영역 -->
    <div id="player-list" class="card-grid"></div>

    <p class="info-text">본 정보는 KBO 공식 발표 및 언론 보도 자료를 기반으로 제공됩니다.</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
